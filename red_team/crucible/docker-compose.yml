version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: red_team
      POSTGRES_PASSWORD: password
      POSTGRES_DB: red_team
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./red_team/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn red_team.api.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A red_team.workers.mutation_worker worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  beat:
    build: .
    command: celery -A red_team.workers.nightly_worker beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
